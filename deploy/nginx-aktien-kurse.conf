# nginx-Konfiguration für die Kurs-Anwendung.
#
# __DOMAIN__ wird von deploy/setup-server.sh durch die echte Domain ersetzt.
# Diese Datei enthält bewusst nur den HTTP-Block (Port 80): certbot --nginx
# ergänzt danach automatisch den HTTPS-Block und die Weiterleitung 80 → 443.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # nginx-Version nicht ausplaudern
    server_tokens off;

    # Die Anwendung hat keine eigene Benutzerverwaltung — der Passwortschutz
    # sitzt deshalb hier davor und gilt für alle Pfade inkl. /api/.
    auth_basic           "Aktien-Kurse";
    auth_basic_user_file /etc/nginx/aktien-kurse.htpasswd;

    # Simulationen und Yahoo-Abrufe sind kleine JSON-Bodies
    client_max_body_size 1m;

    access_log /var/log/nginx/aktien-kurse.access.log;
    error_log  /var/log/nginx/aktien-kurse.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ein erster Abruf bei Yahoo Finance oder eine lange Simulation kann
        # deutlich über die nginx-Standardzeit von 60 s hinausgehen.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
